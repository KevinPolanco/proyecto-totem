<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de caracteres para acentos y eñes -->
    <meta charset="UTF-8">
    <!-- Meta viewport: clave para simular tablet, asegura que ocupe todo el ancho de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tótem Digital - Inicio</title>
    
    <style>
        /* Reset básico: eliminamos márgenes/padding por defecto del navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilos del body: ocupa todo el alto y ancho de la ventana */
        body {
            /* 100vh = 100% del alto de la ventana, aseguramos que ocupe todo el alto */
            min-height: 100vh;
            width: 100%;
            /* Flexbox para centrar contenido vertical y horizontalmente */
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo claro para mejor legibilidad */
            background-color: #f5f5f5;
            /* Fuente sin serifa simple, legible para principiantes */
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal del contenido */
        .contenedor {
            text-align: center;
            padding: 2rem;
            width: 100%;
        }

        /* Título principal de la pantalla inicial */
        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 3rem;
        }

        /* Estilos comunes para los botones grandes táctiles */
        .boton-tramite {
            /* Tamaño grande: padding amplio para fácil toque con dedo */
            padding: 1.5rem 3rem;
            font-size: 1.8rem;
            /* Espacio entre botones */
            margin: 1rem auto;
            /* Ancho adaptable: 90% de la pantalla, máximo 400px para no ser excesivo */
            width: 90%;
            max-width: 400px;
            /* Estilo simple: borde oscuro, fondo blanco */
            border: 2px solid #333;
            background-color: white;
            color: #333;
            /* Sin contorno al hacer clic (evita bordes azules molestos) */
            outline: none;
            /* Cursor de puntero (ayuda si se prueba en escritorio) */
            cursor: pointer;
            /* Bloque para que cada botón esté en su propia línea */
            display: block;
            border-radius: 10px; /* bordes redondeados */
        }

        /* Efecto al pasar el mouse (opcional, simple, no afecta táctil) */
        .boton-tramite:hover {
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Contenedor principal de la pantalla inicial -->
    <div class="contenedor">
        <!-- Título requerido -->
        <h1>¿En qué te ayudamos?</h1>
        
        <!-- Botones de trámites (sin funcionalidad aún, solo estructura visual) -->
        <button class="boton-tramite">TNE</button>
        <button class="boton-tramite">Subsidio de agua</button>
        <button class="boton-tramite">Registro Social de Hogares</button>
    </div>
</body>
</html>
