<!DOCTYPE html>
<html lang="es">
<head>
    <!-- Configuración de caracteres para acentos y eñes -->
    <meta charset="UTF-8">
    <!-- Meta viewport: clave para simular tablet, asegura que ocupe todo el ancho de pantalla -->
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tótem Digital - Inicio</title>
    
    <style>
        /* Reset básico: eliminamos márgenes/padding por defecto del navegador */
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        /* Estilos del body: ocupa todo el alto y ancho de la ventana */
        body {
            /* 100vh = 100% del alto de la ventana, aseguramos que ocupe todo el alto */
            min-height: 100vh;
            width: 100%;
            /* Flexbox para centrar contenido vertical y horizontalmente */
            display: flex;
            justify-content: center;
            align-items: center;
            /* Fondo claro para mejor legibilidad */
            background-color: #f5f5f5;
            /* Fuente sin serifa simple, legible para principiantes */
            font-family: Arial, sans-serif;
        }

        /* Contenedor principal del contenido (usado para ambas pantallas) */
        .contenedor {
            text-align: center;
            padding: 2rem;
            width: 100%;
        }

        /* Título principal de las pantallas */
        h1 {
            font-size: 2.5rem;
            color: #333;
            margin-bottom: 3rem;
        }

        /* Estilos comunes para los botones grandes táctiles */
        .boton-tramite {
            /* Tamaño grande: padding amplio para fácil toque con dedo */
            padding: 1.5rem 3rem;
            font-size: 1.8rem;
            /* Espacio entre botones */
            margin: 1rem auto;
            /* Ancho adaptable: 90% de la pantalla, máximo 400px para no ser excesivo */
            width: 90%;
            max-width: 400px;
            /* Estilo simple: borde oscuro, fondo blanco */
            border: 2px solid #333;
            background-color: white;
            color: #333;
            /* Sin contorno al hacer clic (evita bordes azules molestos) */
            outline: none;
            /* Cursor de puntero (ayuda si se prueba en escritorio) */
            cursor: pointer;
            /* Bloque para que cada botón esté en su propia línea */
            display: block;
            border-radius: 10px;
        }

        /* Efecto al pasar el mouse (opcional, simple, no afecta táctil) */
        .boton-tramite:hover {
            background-color: #333;
            color: white;
        }
    </style>
</head>
<body>
    <!-- Pantalla Inicial: se muestra por defecto -->
    <div id="pantalla-inicio" class="contenedor">
        <h1>¿En qué te ayudamos?</h1>
        
        <!-- Botones de trámites: al hacer clic navegan a la pantalla de detalle -->
        <button class="boton-tramite">TNE</button>
        <button class="boton-tramite">Subsidio de agua</button>
        <button class="boton-tramite">Registro Social de Hogares</button>
    </div>

    <!-- Pantalla de Detalle: oculta por defecto (display: none) -->
    <div id="pantalla-detalle" class="contenedor" style="display: none;">
        <!-- Título que muestra el nombre del trámite seleccionado -->
        <h1 id="titulo-tramite"></h1>
        <!-- Botón para volver a la pantalla inicial -->
        <button class="boton-tramite" id="btn-volver">Volver</button>
    </div>

    <script>
        // Esperamos a que todo el HTML esté cargado antes de ejecutar el código
        document.addEventListener('DOMContentLoaded', function() {
            // --- Obtenemos referencias a los elementos del DOM ---
            // Pantalla inicial (con botones de trámites)
            const pantallaInicio = document.getElementById('pantalla-inicio');
            // Pantalla de detalle (muestra el trámite seleccionado)
            const pantallaDetalle = document.getElementById('pantalla-detalle');
            // Elemento donde mostraremos el nombre del trámite
            const tituloTramite = document.getElementById('titulo-tramite');
            // Botón de volver a la pantalla inicial
            const btnVolver = document.getElementById('btn-volver');
            // Seleccionamos todos los botones de trámite (excluimos el de volver)
            const botonesTramite = document.querySelectorAll('.boton-tramite:not(#btn-volver)');

            // --- Funciones de navegación ---
            
            // Función para mostrar la pantalla de detalle de un trámite
            function mostrarDetalle(nombreTramite) {
                // Ocultamos la pantalla inicial
                pantallaInicio.style.display = 'none';
                // Mostramos la pantalla de detalle
                pantallaDetalle.style.display = 'block';
                // Ponemos el nombre del trámite en el título
                tituloTramite.textContent = nombreTramite;
            }

            // Función para volver a la pantalla inicial
            function volverInicio() {
                // Ocultamos la pantalla de detalle
                pantallaDetalle.style.display = 'none';
                // Mostramos la pantalla inicial
                pantallaInicio.style.display = 'block';
            }

            // --- Asignamos eventos a los botones ---
            
            // Recorremos cada botón de trámite y les agregamos un evento clic
            botonesTramite.forEach(function(boton) {
                boton.addEventListener('click', function() {
                    // Obtenemos el texto del botón (nombre del trámite)
                    const nombreTramiteSeleccionado = this.textContent;
                    // Llamamos a la función para mostrar el detalle
                    mostrarDetalle(nombreTramiteSeleccionado);
                });
            });

            // Agregamos evento clic al botón de volver
            btnVolver.addEventListener('click', volverInicio);
        });
    </script>
</body>
</html>
